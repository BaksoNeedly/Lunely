<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunely — Global Chat</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-soft: #f8f9fc;
            --line: #e7e9f1;
            --text: #1d2030;
            --muted: #8c91a3;
            --accent: #6957e8;
            --accent-dark: #5745d4;
            --shadow: 0 24px 70px rgba(38, 38, 72, 0.10);
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }

        body {
            margin: 0;
            color: var(--text);
            background: var(--bg);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button, input { font: inherit; }
        button { cursor: pointer; }

        .app-shell {
            display: flex;
            flex-direction: column;
            width: min(100% - 32px, 1040px);
            height: min(820px, calc(100vh - 48px));
            min-height: min(820px, calc(100vh - 48px));
            margin: 24px auto;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid rgba(231, 233, 241, 0.95);
            border-radius: 28px;
            box-shadow: var(--shadow);
        }

        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 22px 30px; border-bottom: 1px solid var(--line); }
        .brand { display: flex; align-items: center; gap: 11px; }
        .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; color: #fff; background: var(--accent); border-radius: 12px; font-size: 20px; box-shadow: 0 7px 16px rgba(105, 87, 232, .24); }
        .brand-name { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
        .brand-subtitle { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
        .online-status { display: flex; align-items: center; gap: 8px; color: #697082; font-size: 12px; font-weight: 650; }
        .status-dot { width: 8px; height: 8px; background: #4bc582; border-radius: 50%; box-shadow: 0 0 0 4px #e6f8ed; }

        .chat { display: flex; flex: 1; flex-direction: column; min-height: 0; background: var(--surface-soft); }
        .chat-intro { padding: 34px 40px 20px; text-align: center; }
        .chat-intro h1 { margin: 0; font-size: clamp(24px, 3vw, 32px); letter-spacing: -.055em; }
        .chat-intro p { max-width: 420px; margin: 9px auto 0; color: var(--muted); font-size: 13px; line-height: 1.55; }

        .messages {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 18px;
            width: min(100%, 680px);
            min-height: 0;
            margin: 0 auto;
            padding: 10px 24px 30px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #c6c0f7 transparent;
        }
        .messages::-webkit-scrollbar { width: 8px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: #c6c0f7; border: 2px solid transparent; border-radius: 999px; background-clip: padding-box; }
        .messages::-webkit-scrollbar-thumb:hover { background: #a99ff0; border-width: 1px; }
        .day-divider { display: flex; align-items: center; gap: 12px; margin: 2px 0 4px; color: #b0b4c1; font-size: 10px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
        .day-divider::before, .day-divider::after { height: 1px; flex: 1; content: ""; background: var(--line); }
        .system-message { align-self: center; max-width: 100%; padding: 6px 12px; color: #999eae; background: #f0f1f6; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: .02em; overflow-wrap: anywhere; text-align: center; }
        .message { display: flex; align-items: flex-end; gap: 10px; max-width: 82%; min-width: 0; }
        .message.mine { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { display: grid; width: 30px; height: 30px; flex: 0 0 30px; place-items: center; color: #5b4b28; background: #f6d989; border-radius: 10px; font-size: 11px; font-weight: 800; }
        .message:nth-of-type(2) .avatar { color: #3c5680; background: #c9ddfa; }
        .message.mine .avatar { color: #fff; background: #a58df5; }
        .message-content { min-width: 0; }
        .message-meta { display: flex; align-items: center; gap: 7px; margin: 0 0 6px 2px; }
        .mine .message-meta { justify-content: flex-end; margin-right: 2px; }
        .message-name { color: #62687a; font-size: 11px; font-weight: 750; }
        .message-time { color: #b1b5c1; font-size: 10px; }
        .bubble { padding: 11px 14px; color: #4c5060; background: #fff; border: 1px solid var(--line); border-radius: 6px 16px 16px 16px; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
        .mine .bubble { color: #fff; background: var(--accent); border-color: var(--accent); border-radius: 16px 6px 16px 16px; box-shadow: 0 7px 14px rgba(105, 87, 232, .14); }

        .composer-wrap { padding: 14px 24px 24px; background: var(--surface); border-top: 1px solid var(--line); }
        .composer { display: flex; align-items: center; gap: 10px; width: min(100%, 680px); margin: 0 auto; padding: 7px 8px 7px 16px; background: var(--surface-soft); border: 1px solid var(--line); border-radius: 17px; transition: border-color .2s, box-shadow .2s; }
        .composer:focus-within { border-color: #b6adfa; box-shadow: 0 0 0 4px rgba(105, 87, 232, .09); }
        .composer input { min-width: 0; flex: 1; color: var(--text); background: transparent; border: 0; outline: 0; font-size: 13px; }
        .composer input::placeholder { color: #a4a8b6; }
        .send-button { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; color: #fff; background: var(--accent); border: 0; border-radius: 12px; transition: background .2s, transform .2s; }
        .send-button:hover { background: var(--accent-dark); transform: translateY(-1px); }
        .send-button:active { transform: translateY(0); }
        .send-button svg { width: 17px; height: 17px; }
        .hint { margin: 10px 0 0; color: #b0b4c1; font-size: 10px; text-align: center; }

        @media (max-width: 620px) {
            .app-shell { width: 100%; height: 100vh; min-height: 100vh; margin: 0; border: 0; border-radius: 0; }
            .topbar { padding: 17px 18px; }
            .chat-intro { padding: 28px 20px 16px; }
            .messages { padding: 8px 16px 24px; }
            .message { max-width: 90%; }
            .composer-wrap { padding: 12px 14px 18px; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="topbar" data-header>
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">✦</div>
                <div>
                    <p class="brand-name">Lunely</p>
                    <p class="brand-subtitle">Global chat</p>
                </div>
            </div>
            <div class="online-status"><span class="status-dot"></span><span data-online-count>128 people online</span></div>
        </header>

        <main class="chat" data-body>
            <section class="chat-intro">
                <h1>Chat with anyone.</h1>
                <p>Join in, say anything, and be part of the global conversation. No room or contact list required.</p>
            </section>

            <section class="messages" data-messages aria-live="polite">

                <article class="message">
                    <div class="avatar" aria-hidden="true">NA</div>
                    <div class="message-content">
                        <div class="message-meta"><span class="message-name">Nadia</span><span class="message-time">10:42</span></div>
                        <div class="bubble">Good morning, everyone! Is anyone listening to anything good today? 🎧</div>
                    </div>
                </article>
                <article class="message">
                    <div class="avatar" aria-hidden="true">RA</div>
                    <div class="message-content">
                        <div class="message-meta"><span class="message-name">Raka</span><span class="message-time">10:43</span></div>

                    </div>
                </article>
                <article class="message mine">
                    <div class="avatar" aria-hidden="true">YO</div>
                    <div class="message-content">
                        <div class="message-meta"><span class="message-name">You</span><span class="message-time">10:44</span></div>
                        <div class="bubble">Nice, could you share it? 😄</div>
                    </div>
                </article> -->
            </section>
        </main>

        <footer class="composer-wrap" data-footer>
            <form class="composer" data-composer>
                <input data-message-input type="text" autocomplete="off" placeholder="Write a message to global chat..." aria-label="Write a message">
                <button class="send-button" type="submit" aria-label="Send message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M22 2 11 13"></path>
                        <path d="m22 2-7 20-4-9-9-4Z"></path>
                    </svg>
                </button>
            </form>
            <p class="hint">Press Enter to send</p>
        </footer>
    </div>

    <script type="module" src="dist/app.js"></script>
</body>
</html>
